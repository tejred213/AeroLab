[project]
name = "aerolab-backend"
version = "0.1.0"
description = "AeroLab simulation backend: analytical / reduced-order aerodynamic engines, CFD adapter, ML surrogate, optimisation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=2.0",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Raised by Starlette's test client about its own HTTP dependency; nothing in this project to change.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.uv]
package = false
